server:
  port: 9204

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:change-me-local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bitoj_dev}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_APP_USER:ojtest}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:change-me-local}}
    driver-class-name: com.mysql.cj.jdbc.Driver

sandbox:
  docker:
    image: ${SANDBOX_DOCKER_IMAGE:syncode/oj-sandbox-multilang:1.0.0}
    name-prefix: ${SANDBOX_DOCKER_NAME_PREFIX:oj-sandbox-core}
    volume: /usr/share/java
  limit:
    compile-time: ${SANDBOX_COMPILE_TIMEOUT_SECONDS:10}
    total-time: ${SANDBOX_TOTAL_TIMEOUT_SECONDS:60}

judge:
  consumer:
    prefetch: ${JUDGE_CONSUMER_PREFETCH:0}
  scheduler:
    workers: ${JUDGE_SCHEDULER_WORKERS:0}
    realtime-burst: ${JUDGE_REALTIME_BURST:4}
    queue-capacity-multiplier: ${JUDGE_QUEUE_CAPACITY_MULTIPLIER:1}
  lock:
    lease-seconds: ${JUDGE_LOCK_LEASE_SECONDS:30}
    renew-interval-seconds: ${JUDGE_LOCK_RENEW_INTERVAL_SECONDS:10}
  runtime-state:
    ttl-minutes: 1440
