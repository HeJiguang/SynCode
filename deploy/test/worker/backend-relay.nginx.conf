worker_processes 1;

events {
    worker_connections 128;
}

stream {
    server {
        listen 5672;
        proxy_pass rabbitmq:5672;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }

    server {
        listen 6379;
        proxy_pass redis:6379;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
