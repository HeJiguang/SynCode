services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: prod_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: prod_nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  web:
    image: ${WEB_IMAGE}
    environment:
      APP_NAME: web
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  app:
    image: ${APP_IMAGE}
    environment:
      APP_NAME: app
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
      SYNCODE_HERMES_BASE_URL: http://hermes:8642
      SYNCODE_HERMES_API_KEY: ${SYNCODE_HERMES_API_KEY}
      SYNCODE_HERMES_SESSION_SECRET: ${SYNCODE_HERMES_SESSION_SECRET}
      SYNCODE_HERMES_PROVISION_URL: http://oj-agent-tools:8016/internal/profiles/ensure
      SYNCODE_SKILL_TELEMETRY_URL: http://oj-agent-tools:8016/internal/skill-events
      SYNCODE_HERMES_PROVISION_KEY: ${SYNCODE_HERMES_PROVISION_KEY}
      SYNCODE_DEMO_LOGIN_ENABLED: ${SYNCODE_DEMO_LOGIN_ENABLED:-false}
      SYNCODE_HERMES_RUNS_PER_MINUTE: ${SYNCODE_HERMES_RUNS_PER_MINUTE:-12}
    networks:
      - edge
      - backend
      - agent
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  admin:
    image: ${ADMIN_IMAGE}
    environment:
      APP_NAME: admin
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
      SYNCODE_SKILL_GOVERNANCE_URL: http://oj-agent-tools:8016
      SYNCODE_HERMES_PROVISION_KEY: ${SYNCODE_HERMES_PROVISION_KEY}
    networks:
      - edge
      - backend
      - agent
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-gateway:
    image: ${GATEWAY_IMAGE}
    env_file:
      - ../env/runtime.env
    networks:
      backend:
        aliases:
          - backend-api
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-system:
    image: ${SYSTEM_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "11"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - system_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-friend:
    image: ${FRIEND_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      AGENT_PUBLIC_BASE_URL: http://oj-agent:8015
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "12"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - friend_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-job:
    image: ${JOB_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "13"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - job_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-agent:
    image: ${AGENT_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      OJ_AGENT_RUNTIME_PROVIDER: hermes
      OJ_AGENT_RUNTIME_FALLBACK_TO_DIRECT: "false"
      OJ_AGENT_HERMES_BASE_URL: http://hermes:8642
      OJ_AGENT_HERMES_API_KEY: ${SYNCODE_HERMES_API_KEY}
      OJ_AGENT_HERMES_PROVISION_URL: http://oj-agent-tools:8016/internal/profiles/ensure
      OJ_AGENT_HERMES_PROVISION_KEY: ${SYNCODE_HERMES_PROVISION_KEY}
      OJ_AGENT_HERMES_PROVIDER: deepseek
      OJ_AGENT_HERMES_CHAT_MODEL: ${HERMES_MODEL:-deepseek-chat}
      OJ_AGENT_HERMES_TRAINING_MODEL: ${HERMES_MODEL:-deepseek-chat}
      OJ_AGENT_RUNTIME_DATA_DIR: /app/runtime-artifacts
    volumes:
      - agent_runtime_data:/app/runtime-artifacts
    networks:
      - backend
      - agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8015/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      placement:
        constraints:
          - ${WORKER_CONSTRAINT}

  oj-agent-tools:
    image: ${AGENT_IMAGE}
    command: ["uvicorn", "app.mcp_gateway.server:app", "--host", "0.0.0.0", "--port", "8016"]
    env_file:
      - ../env/runtime.env
    environment:
      HERMES_HOME: /var/lib/hermes
      HERMES_API_SERVER_KEY: ${SYNCODE_HERMES_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${HERMES_DEEPSEEK_API_KEY}
      SYNCODE_HERMES_PROVISION_KEY: ${SYNCODE_HERMES_PROVISION_KEY}
      SYNCODE_HERMES_BUNDLED_SKILLS_DIR: /opt/syncode/hermes/skills
      SYNCODE_HERMES_PLATFORM_SKILLS_DIR: /opt/platform-data/platform-skills
      SYNCODE_PLATFORM_SKILL_STORE: /var/lib/hermes/platform-skills
      SYNCODE_SKILL_GOVERNANCE_HEARTBEAT_ENABLED: "true"
      SYNCODE_SKILL_GOVERNANCE_HEARTBEAT_SECONDS: ${SYNCODE_SKILL_GOVERNANCE_HEARTBEAT_SECONDS:-86400}
      SYNCODE_ELASTICSEARCH_URL: ${SYNCODE_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      SYNCODE_SKILL_EMBEDDING_URL: ${SYNCODE_SKILL_EMBEDDING_URL:-local://fastembed}
      SYNCODE_SKILL_EMBEDDING_API_KEY: ${SYNCODE_SKILL_EMBEDDING_API_KEY:-}
      SYNCODE_SKILL_EMBEDDING_MODEL: ${SYNCODE_SKILL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      SYNCODE_SKILL_EMBEDDING_DIMENSIONS: ${SYNCODE_SKILL_EMBEDDING_DIMENSIONS:-512}
      SYNCODE_SKILL_EMBEDDING_THREADS: ${SYNCODE_SKILL_EMBEDDING_THREADS:-2}
      SYNCODE_SKILL_MIN_RRF_SCORE: ${SYNCODE_SKILL_MIN_RRF_SCORE:-0.03}
      SYNCODE_LEARNING_MEMORY_INDEX: ${SYNCODE_LEARNING_MEMORY_INDEX:-syncode-learning-memory-v1}
      SYNCODE_LEARNING_MEMORY_MIN_RRF_SCORE: ${SYNCODE_LEARNING_MEMORY_MIN_RRF_SCORE:-0.012}
      SYNCODE_PLATFORM_SKILL_STALE_DAYS: ${SYNCODE_PLATFORM_SKILL_STALE_DAYS:-30}
      SYNCODE_PLATFORM_SKILL_MAX_USAGE_30D: ${SYNCODE_PLATFORM_SKILL_MAX_USAGE_30D:-1}
      SYNCODE_MCP_PUBLIC_URL: http://oj-agent-tools:8016/mcp
      SYNCODE_MCP_SERVICE_KEY: ${SYNCODE_MCP_SERVICE_KEY}
      SYNCODE_PRODUCTION_READINESS_STRICT: ${SYNCODE_PRODUCTION_READINESS_STRICT:-true}
    volumes:
      - hermes_data:/var/lib/hermes
      - hermes_platform_skills:/var/lib/hermes/platform-skills
    networks:
      - backend
      - agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8016/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  hermes:
    image: ${HERMES_IMAGE}
    command: ["gateway", "run"]
    security_opt:
      - no-new-privileges:true
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      GATEWAY_MULTIPLEX_PROFILES: "true"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${SYNCODE_HERMES_API_KEY}
      DEEPSEEK_API_KEY: ${HERMES_DEEPSEEK_API_KEY}
    volumes:
      - hermes_data:/opt/data
      - type: volume
        source: hermes_platform_skills
        target: /opt/platform-data/platform-skills
        read_only: true
    networks:
      - agent
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-judge:
    image: ${JUDGE_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SANDBOX_EXECUTION_MODE: ${SANDBOX_EXECUTION_MODE:-pool}
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "14"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - judge_id_state:/app/id-state
      - type: bind
        source: ${DOCKER_SOCKET_PATH}
        target: /var/run/docker.sock
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_DIR}
        target: /app/user-code
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_POOL_DIR}
        target: /app/user-code-pool
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${WORKER_CONSTRAINT}

configs:
  prod_nginx_conf:
    name: ${STACK_NAME}_prod_nginx_conf_${NGINX_CONFIG_DIGEST}
    file: ../nginx/nginx.conf
  prod_nginx_default_conf:
    name: ${STACK_NAME}_prod_nginx_default_conf_${NGINX_CONFIG_DIGEST}
    file: ../nginx/conf.d/default.conf

networks:
  edge:
    driver: overlay
  backend:
    driver: overlay
  agent:
    driver: overlay

volumes:
  system_id_state:
  friend_id_state:
  job_id_state:
  judge_id_state:
  agent_runtime_data:
  hermes_data:
    name: ${STACK_NAME}_hermes_data
  hermes_platform_skills:
    name: ${STACK_NAME}_hermes_platform_skills
