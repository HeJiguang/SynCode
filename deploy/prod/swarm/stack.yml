services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: prod_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: prod_nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  web:
    image: ${WEB_IMAGE}
    environment:
      APP_NAME: web
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  app:
    image: ${APP_IMAGE}
    environment:
      APP_NAME: app
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
      AGENT_PUBLIC_BASE_URL: http://oj-agent:8015
      SYNCODE_DEMO_LOGIN_ENABLED: ${SYNCODE_DEMO_LOGIN_ENABLED:-false}
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  admin:
    image: ${ADMIN_IMAGE}
    environment:
      APP_NAME: admin
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-gateway:
    image: ${GATEWAY_IMAGE}
    env_file:
      - ../env/runtime.env
    networks:
      backend:
        aliases:
          - backend-api
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-system:
    image: ${SYSTEM_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "11"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - system_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-friend:
    image: ${FRIEND_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "12"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - friend_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-job:
    image: ${JOB_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "13"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - job_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-agent:
    image: ${AGENT_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      OJ_AGENT_AUTH_BASE_URL: http://oj-gateway:19090
      OJ_AGENT_ALLOW_INSECURE_USER_ID_BODY: "false"
      OJ_AGENT_RUNTIME_DATA_DIR: /app/runtime-artifacts
    volumes:
      - agent_runtime_data:/app/runtime-artifacts
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${WORKER_CONSTRAINT}

  oj-judge:
    image: ${JUDGE_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SANDBOX_EXECUTION_MODE: ${SANDBOX_EXECUTION_MODE:-pool}
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "14"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - judge_id_state:/app/id-state
      - type: bind
        source: ${DOCKER_SOCKET_PATH}
        target: /var/run/docker.sock
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_DIR}
        target: /app/user-code
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_POOL_DIR}
        target: /app/user-code-pool
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${WORKER_CONSTRAINT}

configs:
  prod_nginx_conf:
    file: ../nginx/nginx.conf
  prod_nginx_default_conf:
    file: ../nginx/conf.d/default.conf

networks:
  edge:
    driver: overlay
  backend:
    driver: overlay

volumes:
  system_id_state:
  friend_id_state:
  job_id_state:
  judge_id_state:
  agent_runtime_data:
