services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: prod_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: prod_nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  web:
    image: ${WEB_IMAGE}
    environment:
      APP_NAME: web
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  app:
    image: ${APP_IMAGE}
    environment:
      APP_NAME: app
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
      AGENT_PUBLIC_BASE_URL: http://oj-agent:8015
      SYNCODE_AGENT_RUNTIME_BASE_URL: http://agent-runtime-gateway:8017
      SYNCODE_AGENT_RUNTIME_API_KEY: ${SYNCODE_AGENT_RUNTIME_GATEWAY_KEY}
      SYNCODE_AGENT_RUNTIME_SESSION_SECRET: ${SYNCODE_HERMES_SESSION_SECRET}
      SYNCODE_DEMO_LOGIN_ENABLED: ${SYNCODE_DEMO_LOGIN_ENABLED:-false}
    networks:
      - edge
      - backend
      - agent-control
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  admin:
    image: ${ADMIN_IMAGE}
    environment:
      APP_NAME: admin
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-gateway:19090
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-gateway:
    image: ${GATEWAY_IMAGE}
    env_file:
      - ../env/runtime.env
    networks:
      backend:
        aliases:
          - backend-api
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-system:
    image: ${SYSTEM_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "11"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - system_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-friend:
    image: ${FRIEND_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "12"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - friend_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-job:
    image: ${JOB_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "13"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - job_id_state:/app/id-state
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-agent:
    image: ${AGENT_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      OJ_AGENT_AUTH_BASE_URL: http://oj-gateway:19090
      OJ_AGENT_ALLOW_INSECURE_USER_ID_BODY: "false"
      OJ_AGENT_RUNTIME_DATA_DIR: /app/runtime-artifacts
    volumes:
      - agent_runtime_data:/app/runtime-artifacts
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${WORKER_CONSTRAINT}

  oj-agent-tools:
    image: ${AGENT_IMAGE}
    command: ["uvicorn", "app.mcp_gateway.server:app", "--host", "0.0.0.0", "--port", "8016"]
    env_file:
      - ../env/runtime.env
    environment:
      HERMES_HOME: /var/lib/hermes
      HERMES_API_SERVER_KEY: ${SYNCODE_HERMES_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${HERMES_DEEPSEEK_API_KEY}
      SYNCODE_HERMES_PROVISION_KEY: ${SYNCODE_HERMES_PROVISION_KEY}
      SYNCODE_HERMES_SKILLS_DIR: /opt/syncode/hermes/skills
      SYNCODE_MCP_PUBLIC_URL: http://oj-agent-tools:8016/mcp
      SYNCODE_MCP_SERVICE_KEY: ${SYNCODE_MCP_SERVICE_KEY}
    volumes:
      - hermes_data:/var/lib/hermes
    networks:
      - backend
      - agent-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8016/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  agent-runtime-gateway:
    image: ${AGENT_IMAGE}
    command: ["uvicorn", "app.runtime_gateway.server:app", "--host", "0.0.0.0", "--port", "8017"]
    environment:
      SYNCODE_RUNTIME_GATEWAY_KEY: ${SYNCODE_AGENT_RUNTIME_GATEWAY_KEY}
      SYNCODE_RUNTIME_REGISTRY_PATH: /var/lib/syncode-runtime/registry.json
      SYNCODE_RUNTIME_LEDGER_PATH: /var/lib/syncode-runtime/runtime-ledger.sqlite3
      SYNCODE_RUNTIME_MAX_RUNS_PER_USER: ${SYNCODE_RUNTIME_MAX_RUNS_PER_USER:-2}
      SYNCODE_RUNTIME_MAX_RUNS_PER_RUNTIME: ${SYNCODE_RUNTIME_MAX_RUNS_PER_RUNTIME:-20}
      SYNCODE_RUNTIME_RUN_STALE_SECONDS: ${SYNCODE_RUNTIME_RUN_STALE_SECONDS:-3600}
      SYNCODE_RUNTIME_AUTO_FAILOVER: ${SYNCODE_RUNTIME_AUTO_FAILOVER:-true}
      SYNCODE_RUNTIME_DEFAULT_NAME: hermes
      SYNCODE_RUNTIME_DEFAULT_ADAPTER: hermes
      SYNCODE_RUNTIME_DEFAULT_BASE_URL: http://hermes:8642
      SYNCODE_RUNTIME_DEFAULT_API_KEY: ${SYNCODE_HERMES_API_KEY}
      SYNCODE_RUNTIME_DEFAULT_PROVISION_URL: http://oj-agent-tools:8016/internal/profiles/ensure
      SYNCODE_RUNTIME_DEFAULT_PROVISION_KEY: ${SYNCODE_HERMES_PROVISION_KEY}
    volumes:
      - runtime_gateway_data:/var/lib/syncode-runtime
    networks:
      - agent-control
      - agent-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8017/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  learning-profile-scheduler:
    image: ${AGENT_IMAGE}
    command: ["uvicorn", "app.profile_scheduler.server:app", "--host", "0.0.0.0", "--port", "8018"]
    env_file:
      - ../env/runtime.env
    environment:
      OJ_AGENT_NACOS_CONFIG_ENABLED: "false"
      OJ_AGENT_NACOS_ENABLED: "false"
      SYNCODE_AGENT_RUNTIME_BASE_URL: http://agent-runtime-gateway:8017
      SYNCODE_AGENT_RUNTIME_GATEWAY_KEY: ${SYNCODE_AGENT_RUNTIME_GATEWAY_KEY}
      SYNCODE_LEARNING_PROFILE_POLL_SECONDS: ${SYNCODE_LEARNING_PROFILE_POLL_SECONDS:-900}
      SYNCODE_LEARNING_PROFILE_BATCH_SIZE: ${SYNCODE_LEARNING_PROFILE_BATCH_SIZE:-500}
      SYNCODE_LEARNING_PROFILE_MAX_RUNS_PER_SWEEP: ${SYNCODE_LEARNING_PROFILE_MAX_RUNS_PER_SWEEP:-5}
    networks:
      - backend
      - agent-control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8018/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 192M

  hermes:
    image: ${HERMES_IMAGE}
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      GATEWAY_MULTIPLEX_PROFILES: "true"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${SYNCODE_HERMES_API_KEY}
      DEEPSEEK_API_KEY: ${HERMES_DEEPSEEK_API_KEY}
    volumes:
      - hermes_data:/opt/data
    networks:
      - agent-runtime
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}

  oj-judge:
    image: ${JUDGE_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: swarm
      SANDBOX_EXECUTION_MODE: ${SANDBOX_EXECUTION_MODE:-pool}
      SYNCODE_ID_LOGICAL_CLOCK_ENABLED: "true"
      SYNCODE_ID_LOGICAL_CLOCK_WORKER_ID: "14"
      SYNCODE_ID_LOGICAL_CLOCK_STATE_FILE: /app/id-state/high-watermark.properties
    volumes:
      - judge_id_state:/app/id-state
      - type: bind
        source: ${DOCKER_SOCKET_PATH}
        target: /var/run/docker.sock
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_DIR}
        target: /app/user-code
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_POOL_DIR}
        target: /app/user-code-pool
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - ${WORKER_CONSTRAINT}

configs:
  prod_nginx_conf:
    file: ../nginx/nginx.conf
  prod_nginx_default_conf:
    file: ../nginx/conf.d/default.conf

networks:
  edge:
    driver: overlay
  backend:
    driver: overlay
  agent-control:
    driver: overlay
  agent-runtime:
    driver: overlay

volumes:
  system_id_state:
  friend_id_state:
  job_id_state:
  judge_id_state:
  agent_runtime_data:
  runtime_gateway_data:
  hermes_data:
