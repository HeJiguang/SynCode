services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: compact_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: compact_nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 128M

  web:
    image: ${WEB_IMAGE}
    environment:
      APP_NAME: web
      APP_URL: http://app:3000
      ADMIN_URL: http://admin:3000
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-runtime:19090
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 320M

  app:
    image: ${APP_IMAGE}
    environment:
      APP_NAME: app
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-runtime:19090
      SYNCODE_DEMO_LOGIN_ENABLED: ${SYNCODE_DEMO_LOGIN_ENABLED:-false}
      SYNCODE_TEST_LOGIN_ENABLED: ${SYNCODE_TEST_LOGIN_ENABLED:-false}
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 320M

  admin:
    image: ${ADMIN_IMAGE}
    environment:
      APP_NAME: admin
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SYNCODE_BACKEND_BASE_URL: http://oj-runtime:19090
      SYNCODE_TEST_LOGIN_ENABLED: ${SYNCODE_TEST_LOGIN_ENABLED:-false}
    networks:
      - edge
      - backend
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 320M

  oj-runtime:
    image: ${RUNTIME_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SERVER_PORT: 19090
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError
      NACOS_ENABLED: "false"
      NACOS_CONFIG_ENABLED: "false"
      NACOS_DISCOVERY_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      OJ_JUDGE_BASE_URL: http://oj-judge:9204
      AGENT_PUBLIC_BASE_URL: http://oj-agent:8015
      SYNCODE_TEST_LOGIN_ENABLED: ${SYNCODE_TEST_LOGIN_ENABLED:-false}
      SYNCODE_TEST_STUDENT_EMAIL: ${SYNCODE_TEST_STUDENT_EMAIL:-student@syncode.test}
      SYNCODE_TEST_TEACHER_EMAIL: ${SYNCODE_TEST_TEACHER_EMAIL:-teacher@syncode.test}
      SYNCODE_TEST_TEACHER_ACCOUNT: ${SYNCODE_TEST_TEACHER_ACCOUNT:-admin}
    networks:
      backend:
        aliases:
          - backend-api
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:19090/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 1408M
        reservations:
          memory: 768M

  oj-judge:
    image: ${JUDGE_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      SERVER_PORT: 9204
      SPRING_PROFILES_ACTIVE: swarm
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET_PATH}
        target: /var/run/docker.sock
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_DIR}
        target: /app/user-code
      - type: bind
        source: ${JUDGE_HOST_USER_CODE_POOL_DIR}
        target: /app/user-code-pool
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9204/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 896M
        reservations:
          memory: 384M

  oj-agent:
    image: ${AGENT_IMAGE}
    env_file:
      - ../env/runtime.env
    environment:
      OJ_AGENT_NACOS_ENABLED: "false"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8015/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      placement:
        constraints:
          - ${MANAGER_CONSTRAINT}
      resources:
        limits:
          memory: 384M

configs:
  compact_nginx_conf:
    file: ../nginx/nginx.conf
  compact_nginx_default_conf:
    file: ../nginx/conf.d/default.conf

networks:
  edge:
    driver: overlay
  backend:
    external: true
    name: ${BACKEND_NETWORK}
