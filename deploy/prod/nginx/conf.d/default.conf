map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_upstream {
  zone web_upstream 64k;
  server web:3000 resolve;
}

upstream app_upstream {
  zone app_upstream 64k;
  server app:3000 resolve;
}

upstream admin_upstream {
  zone admin_upstream 64k;
  server admin:3000 resolve;
}

upstream backend_upstream {
  zone backend_upstream 64k;
  server backend-api:19090 resolve;
}

server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /admin/ {
    proxy_pass http://admin_upstream;
  }

  location = /admin {
    proxy_pass http://admin_upstream;
  }

  location /app/ {
    proxy_pass http://app_upstream;
  }

  location = /app {
    proxy_pass http://app_upstream;
  }

  location = /app/api/ai/hermes/runs {
    client_max_body_size 64k;
    limit_req zone=hermes_runs burst=5 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass http://app_upstream;
  }

  location ~ ^/app/api/ai/hermes/runs/[A-Za-z0-9._:-]+/events$ {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header X-Accel-Buffering no;
    proxy_pass http://app_upstream;
  }

  location /friend/ {
    proxy_pass http://backend_upstream;
  }

  location /system/ {
    proxy_pass http://backend_upstream;
  }

  location /actuator/ {
    proxy_pass http://backend_upstream;
  }

  location / {
    proxy_pass http://web_upstream;
  }
}
