name: prod-diagnose

on:
  workflow_dispatch:

env:
  STACK_NAME: onlineoj-prod
  RUNNER_WORKER_SSH_KEY_FILE: /opt/syncode-runner/.ssh/onlineoj_worker_ci

jobs:
  diagnose:
    name: Diagnose Production Stack
    runs-on:
      - self-hosted
      - linux
      - x64
      - syncode-prod
    steps:
      - name: Clear stale workspace
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}"
          mkdir -p "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect manager diagnostics
        shell: bash
        run: |
          set +e
          echo "=== date ==="
          date
          echo "=== docker service ls ==="
          docker service ls
          echo "=== docker network ls (overlay/bridge) ==="
          docker network ls
          echo "=== published ports on the host ==="
          ss -ltnp | grep -E ':(80|443|3306|13306|8848)' || true
          echo "=== docker stack services onlineoj-prod ==="
          docker stack services "onlineoj-prod"
          echo "=== docker stack ps onlineoj-prod ==="
          docker stack ps "onlineoj-prod" --no-trunc
          echo "=== docker ps ==="
          docker ps
          echo "=== disk usage ==="
          df -h
          echo "=== elasticsearch health ==="
          curl -s --max-time 8 "http://127.0.0.1:9200/_cluster/health" || true
          echo
          curl -s --max-time 8 "http://127.0.0.1:9200/_settings?filter_path=**.blocks.*" || true
          echo
          for service in \
            "onlineoj-prod_nginx" \
            "onlineoj-prod_web" \
            "onlineoj-prod_app" \
            "onlineoj-prod_admin" \
            "onlineoj-prod_oj-gateway" \
            "onlineoj-prod_oj-system" \
            "onlineoj-prod_oj-agent" \
            "onlineoj-prod_oj-friend" \
            "onlineoj-prod_oj-job" \
            "onlineoj-prod_oj-judge"
          do
            echo "=== service inspect: ${service} ==="
            docker service inspect "${service}" --pretty || true
            echo "=== service ps: ${service} ==="
            docker service ps "${service}" --no-trunc || true
            echo "=== service logs: ${service} ==="
            docker service logs --tail 120 "${service}" || true
          done

      - name: Collect serving stack diagnostics
        shell: bash
        run: |
          set +e
          for service in \
            "onlineoj-test_nginx" \
            "onlineoj-test_oj-gateway" \
            "onlineoj-test_oj-friend" \
            "onlineoj-test_oj-judge" \
            "onlineoj-test_oj-system"
          do
            echo "=== service status: ${service} ==="
            docker service ps --no-trunc "${service}" | head -5
            echo "=== service logs (errors): ${service} ==="
            docker service logs --tail 400 "${service}" 2>&1 | grep -E "ERROR|Exception|error" | tail -60
          done

      - name: Prepare worker SSH key
        shell: bash
        env:
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          WORKER_SSH_KEY_FALLBACK: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          chmod +x deploy/prod/scripts/prepare-worker-ssh-key.sh
          deploy/prod/scripts/prepare-worker-ssh-key.sh \
            .cd-tmp/worker_id_ed25519 \
            "${RUNNER_WORKER_SSH_KEY_FILE}"

      - name: Collect worker diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .cd-tmp/worker_id_ed25519 ]]; then
            echo "worker ssh key not prepared, skip worker diagnostics"
            exit 0
          fi
          ssh_opts=(
            -i .cd-tmp/worker_id_ed25519
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=8
          )
          ssh "${ssh_opts[@]}" "root@101.96.200.77" 'bash -s' <<'EOF'
          set +e
          echo "=== worker date ==="
          date
          echo "=== worker docker ps ==="
          docker ps
          echo "=== worker docker images (judge/agent) ==="
          docker images | grep -E 'oj-agent|oj-judge' || true
          EOF
