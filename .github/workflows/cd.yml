name: cd

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override, for example sha-abc123def456
        required: false
        type: string
      source_run_id:
        description: Optional CI run id that contains the deploy bundle artifact
        required: false
        type: string

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  STACK_NAME: onlineoj-prod
  STACK_ENV_FILE: deploy/prod/env/stack.env
  RUNTIME_ENV_FILE: deploy/prod/env/runtime.env
  RUNNER_WORKER_SSH_KEY_FILE: /opt/syncode-runner/.ssh/onlineoj_worker_ci
  SYNCODE_DB_URL: ${{ secrets.SYNCODE_DB_URL_PROD }}
  SYNCODE_DB_USER: ${{ secrets.SYNCODE_DB_USER_PROD }}
  SYNCODE_DB_PASSWORD: ${{ secrets.SYNCODE_DB_PASSWORD_PROD }}

jobs:
  release:
    name: Build And Deploy On Manager
    runs-on:
      - self-hosted
      - linux
      - x64
      - syncode-prod
    steps:
      - name: Resolve deploy metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_run_id="${{ github.event.inputs.source_run_id }}"
          if [[ -z "${source_run_id}" ]]; then
            source_run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi

          read -r source_sha source_branch source_conclusion <<< "$(
            gh api "repos/${{ github.repository }}/actions/runs/${source_run_id}" \
              --jq '[.head_sha, .head_branch, .conclusion] | @tsv'
          )"
          if [[ "${source_branch}" != "main" || "${source_conclusion}" != "success" ]]; then
            echo "CI run ${source_run_id} is not a successful main build" >&2
            exit 1
          fi

          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            image_tag="${{ github.event.inputs.image_tag }}"
          else
            image_tag="sha-${source_sha::12}"
          fi

          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_run_id=${source_run_id}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=deploy-source-${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Download deploy bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf source-bundle
          mkdir -p source-bundle
          gh run download "${{ steps.meta.outputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ steps.meta.outputs.artifact_name }}" \
            --dir source-bundle

      - name: Extract deploy bundle
        shell: bash
        run: |
          rm -rf repo
          mkdir -p repo
          tar xzf source-bundle/deploy-source.tar.gz -C repo

      - name: Prepare runtime env files
        shell: bash
        env:
          LOGIN_MAIL_HOST: ${{ secrets.DEPLOY_NOTIFY_SMTP_HOST }}
          LOGIN_MAIL_PORT: ${{ secrets.DEPLOY_NOTIFY_SMTP_PORT }}
          LOGIN_MAIL_USERNAME: ${{ secrets.DEPLOY_NOTIFY_SMTP_USERNAME }}
          LOGIN_MAIL_PASSWORD: ${{ secrets.DEPLOY_NOTIFY_SMTP_PASSWORD }}
          LOGIN_MAIL_FROM: ${{ secrets.DEPLOY_NOTIFY_FROM }}
        run: |
          cd repo
          printf '%s\n' "${{ secrets.STACK_ENV_PROD }}" > "${STACK_ENV_FILE}"
          printf '%s\n' "${{ secrets.RUNTIME_ENV_PROD }}" > "${RUNTIME_ENV_FILE}"
          {
            echo "NACOS_ENABLED=true"
            echo "NACOS_CONFIG_ENABLED=true"
            echo "NACOS_DISCOVERY_ENABLED=true"
          } >> "${RUNTIME_ENV_FILE}"
          chmod +x deploy/prod/scripts/configure-login-mail.sh
          deploy/prod/scripts/configure-login-mail.sh "${RUNTIME_ENV_FILE}"
          sed -i "s#sha-REPLACE_ME#${{ steps.meta.outputs.image_tag }}#g" "${STACK_ENV_FILE}"

      - name: Prepare worker SSH key
        shell: bash
        env:
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          WORKER_SSH_KEY_FALLBACK: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          chmod +x repo/deploy/prod/scripts/prepare-worker-ssh-key.sh
          repo/deploy/prod/scripts/prepare-worker-ssh-key.sh \
            repo/.cd-tmp/worker_id_ed25519 \
            "${RUNNER_WORKER_SSH_KEY_FILE}"

      - name: Migrate and validate production database
        shell: bash
        run: |
          cd repo
          if [[ -z "${SYNCODE_DB_URL:-}" ]]; then
            echo "SYNCODE_DB_URL_PROD secret is not set; deriving Flyway credentials from ${RUNTIME_ENV_FILE}"
            db_host="$(sed -n 's/^MYSQL_HOST=//p' "${RUNTIME_ENV_FILE}" | tail -1)"
            db_name="$(sed -n 's/^MYSQL_DATABASE=//p' "${RUNTIME_ENV_FILE}" | tail -1)"
            db_user="$(sed -n 's/^MYSQL_APP_USER=//p' "${RUNTIME_ENV_FILE}" | tail -1)"
            db_password="$(sed -n 's/^MYSQL_PASSWORD=//p' "${RUNTIME_ENV_FILE}" | tail -1)"
            if [[ -z "${db_host}" || -z "${db_name}" || -z "${db_user}" || -z "${db_password}" ]]; then
              echo "runtime.env is missing MYSQL_HOST/MYSQL_DATABASE/MYSQL_APP_USER/MYSQL_PASSWORD" >&2
              exit 1
            fi
            reachable=""
            db_port=3306
            relay_started=0
            worker_host="$(sed -n 's/^WORKER_SSH_HOST=//p' "${STACK_ENV_FILE}" | tail -1)"
            worker_user="$(sed -n 's/^WORKER_SSH_USER=//p' "${STACK_ENV_FILE}" | tail -1)"
            worker_port="$(sed -n 's/^WORKER_SSH_PORT=//p' "${STACK_ENV_FILE}" | tail -1)"
            candidates=("${db_host}" "127.0.0.1")
            if [[ -n "${worker_host}" && "${worker_host}" != "${db_host}" ]]; then
              candidates+=("${worker_host}")
            fi
            # The shared MySQL publishes as 13306 on the swarm host; try both ports per candidate.
            for candidate in "${candidates[@]}"; do
              for candidate_port in 3306 13306; do
                if timeout 5 bash -c "</dev/tcp/${candidate}/${candidate_port}" 2>/dev/null; then
                  reachable="${candidate}"
                  db_port="${candidate_port}"
                  break 2
                fi
              done
              echo "MySQL at ${candidate} is not reachable on 3306 or 13306 from the host"
            done
            if [[ -z "${reachable}" ]]; then
              # The manager's host-level egress to MySQL is blocked, but the production service
              # containers reach the database through the Docker bridge. Probe that path and,
              # when it works, relay 127.0.0.1:13306 through a cached python image container.
              for candidate in "${db_host}" "${worker_host}"; do
                [[ -z "${candidate}" ]] && continue
                if docker run --rm debian:bookworm-slim bash -c "timeout 5 bash -c '</dev/tcp/${candidate}/3306'" 2>/dev/null; then
                  echo "MySQL at ${candidate}:3306 is reachable from a container; starting TCP relay"
                  docker rm -f cd-mysql-relay >/dev/null 2>&1 || true
                  if docker run -d --name cd-mysql-relay -p 127.0.0.1:23306:13306 \
                      -v "$(pwd)/deploy/prod/scripts/mysql_relay.py:/relay.py:ro" \
                      python:3.11-slim python /relay.py "${candidate}" 3306 >/dev/null 2>&1; then
                    for _ in $(seq 1 15); do
                      if timeout 2 bash -c "</dev/tcp/127.0.0.1/23306" 2>/dev/null; then
                        reachable="127.0.0.1"
                        db_port=23306
                        relay_started=1
                        break
                      fi
                      sleep 1
                    done
                  fi
                  break
                fi
                echo "MySQL at ${candidate}:3306 is not reachable from a container either"
              done
            fi
            if [[ -z "${reachable}" && -n "${worker_host}" && -n "${worker_user}" ]]; then
              echo "Opening SSH tunnel 127.0.0.1:13306 -> ${worker_host}:3306 for MySQL"
              ssh -i .cd-tmp/worker_id_ed25519 -p "${worker_port:-22}" \
                -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes \
                -f -N -L 23306:127.0.0.1:3306 "${worker_user}@${worker_host}"
              for _ in $(seq 1 15); do
                if timeout 2 bash -c "</dev/tcp/127.0.0.1/23306" 2>/dev/null; then
                  reachable="127.0.0.1"
                  db_port=23306
                  break
                fi
                sleep 1
              done
            fi
            if [[ -z "${reachable}" ]]; then
              echo "No reachable MySQL on 3306 among: ${candidates[*]}" >&2
              exit 1
            fi
            if [[ "${db_port}" == 3306 && "${reachable}" != "${db_host}" ]]; then
              echo "Direct access to ${db_host} is blocked; migrating via ${reachable} instead"
            fi
            export SYNCODE_DB_URL="jdbc:mysql://${reachable}:${db_port}/${db_name}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
            export SYNCODE_DB_USER="${db_user}"
            export SYNCODE_DB_PASSWORD="${db_password}"
          fi
          migrate_status=0
          mvn --batch-mode -f deploy/migrations/pom.xml flyway:migrate || migrate_status=$?
          if [[ "${migrate_status}" -eq 0 ]]; then
            mvn --batch-mode -f deploy/migrations/pom.xml flyway:validate || migrate_status=$?
          fi
          if [[ "${relay_started}" -eq 1 ]]; then
            docker rm -f cd-mysql-relay >/dev/null 2>&1 || true
          elif [[ "${db_port}" != 3306 ]]; then
            pkill -f "23306:127.0.0.1:3306" 2>/dev/null || true
          fi
          exit "${migrate_status}"

      - name: Verify manager toolchain
        shell: bash
        run: |
          java -version
          mvn -version
          docker version
          docker info

      - name: Build and deploy locally
        shell: bash
        run: |
          cd repo
          chmod +x deploy/prod/scripts/build-images.sh
          chmod +x deploy/prod/scripts/sync-worker-images.sh
          chmod +x deploy/prod/scripts/deploy.sh
          BUILD_LOCAL_IMAGES=true \
          SYNC_WORKER_IMAGES=true \
          WORKER_SSH_KEY_FILE=.cd-tmp/worker_id_ed25519 \
          STACK_ENV_FILE="${STACK_ENV_FILE}" \
          RUNTIME_ENV_FILE="${RUNTIME_ENV_FILE}" \
          deploy/prod/scripts/deploy.sh

      - name: Show stack status
        if: always()
        shell: bash
        run: |
          docker stack services "${STACK_NAME}" || true
          docker stack ps "${STACK_NAME}" || true
